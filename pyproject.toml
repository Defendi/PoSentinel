[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posentinel"
version = "0.1.1"
description = "Odoo Translation Quality Analyzer - Deterministic linter for PO internationalization files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PoSentinel Team" }
]
keywords = ["odoo", "po", "gettext", "i18n", "linter", "translations", "quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "polib>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
posentinel = "posentinel.cli.commands:app"

[project.urls]
Homepage = "https://github.com/posentinel/posentinel"
Documentation = "https://github.com/posentinel/posentinel#readme"
Repository = "https://github.com/posentinel/posentinel"
Issues = "https://github.com/posentinel/posentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/posentinel"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "polib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=posentinel --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
