# ==============================================================================
# PoSentinel - Configuração do Ruff Linter & Formatter (Python 3.12 / PEPs)
# Alinhado com docs/trd.md — seção "Estilo de código"
# ==============================================================================

target-version = "py312"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",     # pycodestyle errors (PEP 8)
    "W",     # pycodestyle warnings (PEP 8)
    "F",     # Pyflakes
    "I",     # isort (organização de imports - PEP 8)
    "B",     # flake8-bugbear (prevenção de bugs)
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (conformidade com Python 3.12 nativo)
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify (simplificação de código Pythonico)
]
ignore = []

[lint.isort]
known-first-party = ["posentinel"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
